<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Play! A microgame from XR Piano / 88 Dimension</title>
<style>
@font-face{font-family:"Oswald";src:url("../assets/fonts/oswald.woff2") format("woff2");font-weight:200 700;font-display:swap}
@font-face{font-family:"Open Sans";src:url("../assets/fonts/open-sans.woff2") format("woff2");font-weight:300 800;font-display:swap}
:root{
  --paper:#efeef6;--accent:#8b57d6;
  --ink:#24262b;--ink-2:#5e6370;--card:#ffffff;--line:rgba(36,38,43,.14);
  --red:#e2453c;--orange:#f29b1f;--yellow:#f2c230;--green:#3aa35b;--teal:#18a39a;--blue:#2e6fd8;--purple:#8b57d6;--pink:#dd4d8d;--brown:#8e5b33;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;pointer-events:none;transition:opacity .2s var(--ease-out)}
body.embed .hud{padding-right:68px}
body.attract .hud{opacity:0}
.cmd{font-family:"Oswald",sans-serif;font-weight:600;font-size:19px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.clock{width:24px;height:24px;flex:none}
.clock .bg{fill:none;stroke:var(--line);stroke-width:4}
.clock .arc{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:12px 12px}
.count{margin-left:auto;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--ink-2)}
.center{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
.center.attract{justify-content:flex-start;padding-top:13vh}
body.fit #stage{transform-origin:50% 0}
body.fit.attract:not(.still) #stage{transform:translateY(var(--fit-y,45vh)) scale(var(--fit-s,.5))}
body.fit .center.attract{padding-top:6vh}
body.fit .center.attract .title{font-size:clamp(32px,8.5vw,66px)}
.title{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(40px,11vw,84px);line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
.title::after{content:"";display:block;width:56%;height:6px;margin:12px auto 0;border-radius:3px;background:var(--accent)}
.sub{margin-top:14px;font-weight:700;font-size:clamp(12px,2.6vw,14px);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pop{animation:pop .3s var(--ease-out) both}
@keyframes pop{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
.result{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:color-mix(in srgb,var(--paper) 94%,transparent)}
.result.on{display:flex}
.result h2{margin:0;font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(28px,7vw,48px);line-height:1.05;text-transform:uppercase;color:var(--ink)}
.result h2::after{content:"";display:block;width:48px;height:5px;margin:12px auto 0;border-radius:3px;background:var(--accent)}
.result.lose h2::after{background:var(--ink-2)}
.result p{max-width:38ch;margin:14px 0 0;font-size:clamp(14px,3.1vw,16px);line-height:1.5}
.again{margin-top:20px;min-height:44px;padding:10px 22px;border:0;border-radius:4px;cursor:pointer;background:var(--ink);color:#fff;
  font-family:"Oswald",sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;transition:transform .16s var(--ease-out)}
.again:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
/* the play surface takes keyboard focus so Tab always has somewhere to land inside the demo */
.surface:focus{outline:none}
.surface:focus-visible{outline:3px solid var(--accent);outline-offset:-3px}
body.micro .again{display:none}
body.still .hud,body.still .center,body.still .result{display:none!important}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
@media (prefers-reduced-motion:no-preference){
  .again:active{transform:scale(.97)}
  body.fit #stage{transition:transform .5s var(--ease-out)}
  body.attract .title::after{animation:bar 1.8s ease-in-out infinite}
  @keyframes bar{50%{transform:scaleX(.55)}}
}
body{transition:background-color .4s var(--ease-out)}
#fx{position:absolute;inset:0;width:100%;height:100%;display:block}
#chord{position:absolute;left:0;right:0;top:54px;display:flex;flex-direction:column;align-items:center;gap:2px;pointer-events:none}
.chord-name{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(22px,5vw,34px);line-height:1.1;color:var(--ink)}
#tones{width:min(320px,74vw);height:auto;display:block}
.tlabel{font-family:"Open Sans",sans-serif;font-weight:700;font-size:14px;fill:#5e6370}
#kb{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);width:min(96vw,760px);height:auto;max-height:48%;display:block;touch-action:none}
.key{cursor:pointer}
.key:focus{outline:none}
.wk{fill:#fff;stroke:#24262b;stroke-width:4}
.bk{fill:#24262b}
.key.down .wk{fill:#e6dcfa}
.key.down .bk{fill:#5b3a99}
.key.bad .wk{stroke:#e2453c}
.key.bad .bk{fill:#e2453c}
.knote{font-family:"Open Sans",sans-serif;font-weight:700;font-size:22px;fill:#5e6370;pointer-events:none}
.mark{pointer-events:none}
#sound{position:absolute;left:16px;top:56px;z-index:4;min-height:32px;padding:4px 12px;border:2px solid var(--ink);border-radius:999px;background:#fff;color:var(--ink);
  font-family:"Open Sans",sans-serif;font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
#sound:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
body.still #sound{display:none}
body.attract:not(.still) #chord,body.attract:not(.still) #sound{visibility:hidden}
</style>
</head>
<body class="attract">
<div id="stage">
<canvas id="fx" aria-hidden="true"></canvas>
<div id="chord" aria-live="polite"><div class="chord-name" id="chordName">C7</div><svg id="tones" viewBox="0 0 320 64" aria-hidden="true"></svg></div>
<svg id="kb" class="surface" tabindex="0" viewBox="0 0 700 230" preserveAspectRatio="xMidYMax meet" role="group" aria-label="Piano keyboard. White keys use A S D F G H J, black keys use W E T Y U."></svg>
<button id="sound" type="button" aria-pressed="false">Sound off</button>
</div>
<div class="hud" aria-hidden="true">
  <svg class="clock" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="9"/><circle class="arc" id="clockArc" cx="12" cy="12" r="9"/></svg>
  <span class="cmd">Play!</span><span class="count" id="count"></span>
</div>
<div class="center attract" id="center"><div class="title" id="bigTitle">Play!</div><div class="sub pulse" id="bigSub">Tap to play</div></div>
<div class="result" id="result" role="status" aria-live="polite"><h2 id="resTitle"></h2><p id="resNote"></p><button class="again" id="again" type="button">Play again</button></div>
<script>
/* Shared microgame runtime: attract, command flash, timed play, result. */
var K=(function(){
  var q=new URLSearchParams(location.search), b=document.body;
  var K={MICRO:q.has('micro'),STILL:q.has('still'),TEST:q.has('test'),state:'attract'};
  K.AUTO=q.has('auto')||K.MICRO;
  K.reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(q.has('embed'))b.classList.add('embed');
  var FIT=document.getElementById('center').classList.contains('veil');
  if(FIT){b.classList.add('fit');document.getElementById('center').classList.remove('veil');}
  if(K.MICRO)b.classList.add('micro');
  if(K.STILL)b.classList.add('still');
  var center=document.getElementById('center'),big=document.getElementById('bigTitle'),sub=document.getElementById('bigSub'),
      res=document.getElementById('result'),resT=document.getElementById('resTitle'),resN=document.getElementById('resNote'),
      again=document.getElementById('again'),arc=document.getElementById('clockArc'),count=document.getElementById('count');
  var CIRC=2*Math.PI*9;arc.style.strokeDasharray=String(CIRC);
  var game=null,timeLeft=0,duration=1,last=0;
  function setClock(f){arc.style.strokeDashoffset=String(CIRC*(1-Math.max(0,Math.min(1,f))));}
  K.setCount=function(t){count.textContent=t;};
  /* fit: scale the scene into the space under the title block */
  function fit(){
    if(!FIT)return;
    var top=sub.getBoundingClientRect().bottom+16,H=window.innerHeight;
    if(!top||top>H*0.8)return;
    var s=Math.max(0.3,Math.min(0.64,(H-top-10)/H));
    b.style.setProperty('--fit-y',Math.round(top)+'px');b.style.setProperty('--fit-s',s.toFixed(3));
  }
  fit();window.addEventListener('resize',function(){if(K.state==='attract')fit();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(K.state==='attract')fit();});
  if(FIT)document.addEventListener('pointerdown',function(e){if(K.state==='attract'&&!K.STILL&&!(e.target.closest&&e.target.closest('button')))K.start();});
  K.timeFraction=function(){return timeLeft/duration;};
  K.start=function(){
    if(K.state==='play'||K.state==='cmd')return;
    res.classList.remove('on');b.classList.remove('attract');center.classList.remove('attract');center.classList.remove('veil');
    K.state='cmd';duration=game.duration(K.MICRO);timeLeft=duration;setClock(1);
    if(game.reset)game.reset();
    center.style.display='flex';big.textContent=game.cmd;sub.textContent=game.go||'';sub.classList.remove('pulse');
    big.classList.remove('pop');void big.offsetWidth;big.classList.add('pop');
    setTimeout(function(){if(K.state!=='cmd')return;K.state='play';center.style.display='none';if(game.begin)game.begin();},K.MICRO?550:750);
  };
  K.finish=function(win){
    if(K.state!=='play')return;
    K.state='done';
    resT.textContent=win?game.winTitle:game.loseTitle;resN.textContent=win?game.winNote:game.loseNote;
    res.classList.toggle('lose',!win);
    setTimeout(function(){res.classList.add('on');if(!K.MICRO)again.focus({preventScroll:true});},win?(game.winDelay||0):0);
    try{if(window.parent!==window)window.parent.postMessage({source:'tamu-microgame',game:game.id,type:'result',win:win},'*');}catch(e){}
  };
  K.go=function(g){
    game=g;
    if(g.init)g.init();
    if(K.STILL){if(g.still)g.still();return;}
    function loop(ts){
      var dt=Math.min((ts-(last||ts))/1000,0.05);last=ts;
      if(K.state==='play'){timeLeft-=dt;setClock(timeLeft/duration);if(timeLeft<=0){if(g.timeout)g.timeout();K.finish(false);}}
      if(g.frame)g.frame(dt,K.state);
      requestAnimationFrame(loop);
    }
    if(K.AUTO)K.start();
    requestAnimationFrame(loop);
  };
  again.addEventListener('click',function(){K.start();});
  window.addEventListener('keydown',function(e){
    if(e.key==='Escape'){try{if(window.parent!==window)window.parent.postMessage({source:'tamu-microgame',type:'escape'},'*');}catch(x){}return;}
    if(K.state==='attract'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();K.start();}
  });
  window.addEventListener('message',function(e){if(e.data&&e.data.source==='tamu-arcade'&&e.data.type==='start')K.start();});
  return K;
})();
</script>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  function el(tag,attrs,parent){var n=document.createElementNS(NS,tag);for(var k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}
  var kb=document.getElementById('kb'),tones=document.getElementById('tones'),chordName=document.getElementById('chordName'),
      fx=document.getElementById('fx'),cx=fx.getContext('2d'),soundBtn=document.getElementById('sound'),body=document.body;
  var W=0,H=0,DPR=1;
  function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=fx.clientWidth;H=fx.clientHeight;fx.width=Math.round(W*DPR);fx.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);}
  window.addEventListener('resize',resize);resize();
  var WHITE=[{s:0,n:'C',k:'a'},{s:2,n:'D',k:'s'},{s:4,n:'E',k:'d'},{s:5,n:'F',k:'f'},{s:7,n:'G',k:'g'},{s:9,n:'A',k:'h'},{s:11,n:'B',k:'j'}];
  var BLACK=[{s:1,x:100,k:'w'},{s:3,x:200,k:'e'},{s:6,x:400,k:'t'},{s:8,x:500,k:'y'},{s:10,x:600,k:'u'}];
  var CHORDS=[
    {name:'C7',tones:[0,4,7,10],labels:['C','E','G','B♭'],pal:['#8b57d6','#2e6fd8','#18a39a','#3aa35b'],paper:'#d9eafa'},
    {name:'F7',tones:[5,9,0,3],labels:['F','A','C','E♭'],pal:['#f29b1f','#dd4d8d','#f2c230','#e2453c'],paper:'#fde0e6'}
  ];
  var BASE='#efeef6',keyEls={},keyOf={};
  WHITE.forEach(function(w,i){
    var g=el('g',{'class':'key','data-s':w.s},kb);
    el('rect',{'class':'wk',x:i*100+3,y:3,width:94,height:222,rx:12},g);
    var t=el('text',{'class':'knote',x:i*100+50,y:206,'text-anchor':'middle'},g);t.textContent=w.n;
    g._cx=i*100+50;g._cy=150;keyEls[w.s]=g;keyOf[w.k]=w.s;
  });
  BLACK.forEach(function(b){
    var g=el('g',{'class':'key','data-s':b.s},kb);
    el('rect',{'class':'bk',x:b.x-28,y:3,width:56,height:138,rx:10},g);
    g._cx=b.x;g._cy=104;keyEls[b.s]=g;keyOf[b.k]=b.s;
  });
  var marker=el('g',{'class':'mark'},kb);
  var markRing=el('circle',{r:22,fill:'none',stroke:'#8b57d6','stroke-width':4,opacity:0.5},marker);
  var markDot=el('circle',{r:15,fill:'#8b57d6',stroke:'#fff','stroke-width':4},marker);
  /* chord line: stations along a line, filled as you play */
  var tBase=el('line',{x1:30,x2:290,y1:22,y2:22,stroke:'rgba(36,38,43,.14)','stroke-width':8,'stroke-linecap':'round'},tones);
  var tProg=el('line',{x1:30,x2:30,y1:22,y2:22,stroke:'#8b57d6','stroke-width':8,'stroke-linecap':'round'},tones);
  var tSt=[],tLb=[];
  for(var i=0;i<4;i++){var x=30+i*(260/3);
    tSt.push(el('circle',{cx:x,cy:22,r:11,fill:'#fff',stroke:'#24262b','stroke-width':4},tones));
    var lb=el('text',{'class':'tlabel',x:x,y:56,'text-anchor':'middle'},tones);tLb.push(lb);}
  var ci=0,ti=0,need=2,doneNotes=0,level=0,bloom=null,waiting=false,rings=[],ctx=null,soundOn=false,t=0,attractI=0,attractT=0;
  function chord(){return CHORDS[ci%CHORDS.length];}
  function showChord(){
    var c=chord();chordName.textContent=c.name;
    for(var i=0;i<4;i++){tLb[i].textContent=c.labels[i];tSt[i].setAttribute('fill',i<ti?c.pal[i]:'#fff');}
    tProg.setAttribute('stroke',c.pal[Math.max(0,ti-1)]||c.pal[0]);
    tProg.setAttribute('x2',30+Math.max(0,ti-1)*(260/3));tProg.setAttribute('opacity',ti>1?1:0);
    placeMarker(c.tones[Math.min(ti,3)],c.pal[Math.min(ti,3)]);
  }
  function placeMarker(semi,col){var g=keyEls[semi];marker.setAttribute('transform','translate('+g._cx+','+g._cy+')');markDot.setAttribute('fill',col);markRing.setAttribute('stroke',col);}
  function keyPoint(semi){var g=keyEls[semi],m=kb.getScreenCTM(),p=kb.createSVGPoint();p.x=g._cx;p.y=g._cy-80;p=p.matrixTransform(m);return {x:p.x,y:p.y};}
  function tone(semi){
    if(!soundOn)return;
    try{
      if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();
      var o=ctx.createOscillator(),g=ctx.createGain(),now=ctx.currentTime;
      o.type='triangle';o.frequency.value=261.63*Math.pow(2,semi/12);
      g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(0.18,now+0.012);g.gain.exponentialRampToValueAtTime(0.0001,now+0.7);
      o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+0.75);
    }catch(e){}
  }
  function flashKey(semi,cls){var g=keyEls[semi];g.classList.remove('down','bad');void g.getBBox();g.classList.add(cls);setTimeout(function(){g.classList.remove(cls);},170);}
  function ring(semi,col){if(K.reduce)return;var p=keyPoint(semi);rings.push({x:p.x,y:p.y,r:6,col:col});}
  function floodFrom(){var r=kb.getBoundingClientRect();return {x:r.left+r.width/2,y:r.top+r.height*0.2};}
  function press(semi){
    if(K.state==='attract'){K.start();return;}
    if(K.state!=='play'||waiting)return;
    var c=chord();
    if(semi===c.tones[ti]){
      flashKey(semi,'down');tone(semi);ring(semi,c.pal[ti]);ti++;doneNotes++;level=ti/4;K.setCount(doneNotes+'/'+(need*4));
      if(ti>=4){
        showChord();waiting=true;var o=floodFrom();bloom={t:0,pal:c.pal,paper:c.paper,x:o.x,y:o.y};
        if(K.reduce){body.style.setProperty('--paper',c.paper);bloom=null;}
        if(ci+1>=need){K.finish(true);}
        else setTimeout(function(){ci++;ti=0;level=0;waiting=false;showChord();},K.reduce?100:650);
      }else showChord();
    }else{flashKey(semi,'bad');}
  }
  Object.keys(keyEls).forEach(function(s){var g=keyEls[s];g.addEventListener('pointerdown',function(e){e.preventDefault();press(+s);});});
  window.addEventListener('keydown',function(e){var k=(e.key||'').toLowerCase();if(k in keyOf&&!e.repeat){press(keyOf[k]);}});
  soundBtn.addEventListener('click',function(e){e.stopPropagation();soundOn=!soundOn;soundBtn.textContent=soundOn?'Sound on':'Sound off';soundBtn.setAttribute('aria-pressed',String(soundOn));
    if(soundOn){try{if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)();ctx.resume();}catch(x){}}});
  fx.addEventListener('pointerdown',function(){if(K.state==='attract')K.start();});
  var FLOOD=1.0;
  function draw(dt){
    cx.clearRect(0,0,W,H);
    var R=Math.hypot(W,H),lw=Math.max(8,Math.min(W,H)*0.03);
    if(bloom){
      /* the chord's four colors run out past the frame in flat bands; the new dimension's paper follows them */
      var u=Math.min(1,bloom.t/FLOOD),e=u<0.5?2*u*u:1-Math.pow(2-2*u,2)/2,band=Math.max(16,Math.min(W,H)*0.07),rr=e*(R+band*4+24);
      for(var k=0;k<4;k++){var rk=rr-k*band;if(rk<=0)break;cx.fillStyle=bloom.pal[k];cx.beginPath();cx.arc(bloom.x,bloom.y,rk,0,Math.PI*2);cx.fill();}
      var rp=rr-4*band;if(rp>0){cx.fillStyle=bloom.paper;cx.beginPath();cx.arc(bloom.x,bloom.y,rp,0,Math.PI*2);cx.fill();}
    }
    for(var i=rings.length-1;i>=0;i--){var r=rings[i];r.r+=dt*R*0.8;
      if(r.r>R*1.1){rings.splice(i,1);continue;}
      cx.strokeStyle=r.col;cx.lineWidth=lw;cx.beginPath();cx.arc(r.x,r.y,r.r,0,Math.PI*2);cx.stroke();}
  }
  K.go({
    id:'play',cmd:'Play!',go:'Play the lit keys',winDelay:1100,
    duration:function(m){need=m?1:2;return m?7:14;},
    winTitle:'New dimension',winNote:'In 88 Dimension you progress through different dimensions, each unlocked by learning a different kind of jazz knowledge.',
    loseTitle:'Out of time',loseNote:'Play the lit keys in order. Each chord you finish opens the next dimension.',
    init:function(){showChord();},
    reset:function(){ci=0;ti=0;doneNotes=0;level=0;bloom=null;waiting=false;rings=[];body.style.setProperty('--paper',BASE);K.setCount('0/'+(need*4));showChord();},
    frame:function(dt,s){
      t+=dt;
      if(bloom){bloom.t+=dt;if(bloom.t>FLOOD){body.style.setProperty('--paper',bloom.paper);bloom=null;}}
      if(s==='attract'&&!K.reduce){attractT+=dt;if(attractT>1.1){attractT=0;var c=chord();var semi=c.tones[attractI%4];ring(semi,c.pal[attractI%4]);placeMarker(semi,c.pal[attractI%4]);attractI++;}}
      draw(dt);
    },
    still:function(){resize();ti=4;showChord();var c=chord(),o=floodFrom();
      bloom={t:FLOOD*0.464,pal:c.pal,paper:c.paper,x:o.x,y:o.y};draw(0);}
  });
  if(K.TEST)window.__G={get state(){return K.state;},nextKey:function(){var c=chord(),s=c.tones[ti];for(var k in keyOf)if(keyOf[k]===s)return k;return null;}};
})();
</script>
</body>
</html>
