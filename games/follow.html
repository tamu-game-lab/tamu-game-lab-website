<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow! A microgame from Eye Rehab</title>
<style>
@font-face{font-family:"Oswald";src:url("../assets/fonts/oswald.woff2") format("woff2");font-weight:200 700;font-display:swap}
@font-face{font-family:"Open Sans";src:url("../assets/fonts/open-sans.woff2") format("woff2");font-weight:300 800;font-display:swap}
:root{
  /* one canvas for every demo, Mini Metro style: a quiet limestone grey under bold transit-line colors */
  --paper:#eeedea;--accent:#2e6fd8;
  --ink:#24262b;--ink-2:#5e6370;--card:#ffffff;--line:rgba(36,38,43,.14);
  --red:#e0443a;--orange:#ee8a1f;--yellow:#f2b21c;--green:#2e9e57;--teal:#13998f;--blue:#2e6fd8;--purple:#7d53c8;--brown:#8e5b33;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;pointer-events:none;transition:opacity .2s var(--ease-out)}
body.embed .hud{padding-right:68px}
body.attract .hud{opacity:0}
.cmd{font-family:"Oswald",sans-serif;font-weight:600;font-size:19px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.clock{width:24px;height:24px;flex:none}
.clock .bg{fill:none;stroke:var(--line);stroke-width:4}
.clock .arc{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:12px 12px}
.count{margin-left:auto;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--ink-2)}
.center{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
.center.attract{justify-content:flex-start;padding-top:13vh}
body.fit #stage{transform-origin:50% 0}
body.fit.attract:not(.still) #stage{transform:translateY(var(--fit-y,45vh)) scale(var(--fit-s,.5))}
body.fit .center.attract{padding-top:6vh}
body.fit .center.attract .title{font-size:clamp(32px,8.5vw,66px)}
.title{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(40px,11vw,84px);line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
.title::after{content:"";display:block;width:56%;height:6px;margin:12px auto 0;border-radius:3px;background:var(--accent)}
.sub{margin-top:14px;font-weight:700;font-size:clamp(12px,2.6vw,14px);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pop{animation:pop .3s var(--ease-out) both}
@keyframes pop{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
.result{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:color-mix(in srgb,var(--paper) 94%,transparent)}
.result.on{display:flex}
.result h2{margin:0;font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(28px,7vw,48px);line-height:1.05;text-transform:uppercase;color:var(--ink)}
.result h2::after{content:"";display:block;width:48px;height:5px;margin:12px auto 0;border-radius:3px;background:var(--accent)}
.result.lose h2::after{background:var(--ink-2)}
.result p{max-width:38ch;margin:14px 0 0;font-size:clamp(14px,3.1vw,16px);line-height:1.5}
.again{margin-top:20px;min-height:44px;padding:10px 22px;border:0;border-radius:4px;cursor:pointer;background:var(--ink);color:#fff;
  font-family:"Oswald",sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;transition:transform .16s var(--ease-out)}
.again:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* the play surface takes keyboard focus so Tab always has somewhere to land inside the demo */
.surface:focus{outline:none}
.surface:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
body.micro .again{display:none}
body.still .hud,body.still .center,body.still .result{display:none!important}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
@media (prefers-reduced-motion:no-preference){
  .again:active{transform:scale(.97)}
  body.fit #stage{transition:transform .5s var(--ease-out)}
  body.attract .title::after{animation:bar 1.8s ease-in-out infinite}
  @keyframes bar{50%{transform:scaleX(.55)}}
}
canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:crosshair}
body.playing canvas{touch-action:none}
.meter{position:fixed;left:16px;right:16px;bottom:14px;pointer-events:none}
.meter-track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.meter-fill{height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;border-radius:5px}
.meter-label{margin-top:6px;text-align:center;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-2)}
</style>
</head>
<body class="attract">
<div id="stage">
<canvas id="c" class="surface" tabindex="0" role="group" aria-label="Follow the light. Keep your pointer on the moving light to fill the meter. Arrow keys also move the pointer."></canvas>
<div class="meter" aria-hidden="true"><div class="meter-track"><div class="meter-fill" id="meter"></div></div><div class="meter-label">Time on target</div></div>
</div>
<div class="hud" aria-hidden="true">
  <svg class="clock" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="9"/><circle class="arc" id="clockArc" cx="12" cy="12" r="9"/></svg>
  <span class="cmd">Follow!</span><span class="count" id="count"></span>
</div>
<div class="center attract" id="center"><div class="title" id="bigTitle">Follow!</div><div class="sub pulse" id="bigSub">Tap to play</div></div>
<div class="result" id="result" role="status" aria-live="polite"><h2 id="resTitle"></h2><p id="resNote"></p><button class="again" id="again" type="button">Play again</button></div>
<script>
/* Shared microgame runtime: attract, command flash, timed play, result. */
var K=(function(){
  var q=new URLSearchParams(location.search), b=document.body;
  var K={MICRO:q.has('micro'),STILL:q.has('still'),TEST:q.has('test'),state:'attract'};
  K.AUTO=q.has('auto')||K.MICRO;
  K.reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(q.has('embed'))b.classList.add('embed');
  var FIT=document.getElementById('center').classList.contains('veil');
  if(FIT){b.classList.add('fit');document.getElementById('center').classList.remove('veil');}
  if(K.MICRO)b.classList.add('micro');
  if(K.STILL)b.classList.add('still');
  var center=document.getElementById('center'),big=document.getElementById('bigTitle'),sub=document.getElementById('bigSub'),
      res=document.getElementById('result'),resT=document.getElementById('resTitle'),resN=document.getElementById('resNote'),
      again=document.getElementById('again'),arc=document.getElementById('clockArc'),count=document.getElementById('count');
  var CIRC=2*Math.PI*9;arc.style.strokeDasharray=String(CIRC);
  var game=null,timeLeft=0,duration=1,last=0;
  function setClock(f){arc.style.strokeDashoffset=String(CIRC*(1-Math.max(0,Math.min(1,f))));}
  K.setCount=function(t){count.textContent=t;};
  /* fit: scale the scene into the space under the title block */
  function fit(){
    if(!FIT)return;
    var top=sub.getBoundingClientRect().bottom+16,H=window.innerHeight;
    if(!top||top>H*0.8)return;
    var s=Math.max(0.3,Math.min(0.64,(H-top-10)/H));
    b.style.setProperty('--fit-y',Math.round(top)+'px');b.style.setProperty('--fit-s',s.toFixed(3));
  }
  fit();window.addEventListener('resize',function(){if(K.state==='attract')fit();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(K.state==='attract')fit();});
  if(FIT)document.addEventListener('pointerdown',function(e){if(K.state==='attract'&&!K.STILL&&!(e.target.closest&&e.target.closest('button')))K.start();});
  K.timeFraction=function(){return timeLeft/duration;};
  K.start=function(){
    if(K.state==='play'||K.state==='cmd')return;
    res.classList.remove('on');b.classList.remove('attract');center.classList.remove('attract');center.classList.remove('veil');
    K.state='cmd';duration=game.duration(K.MICRO);timeLeft=duration;setClock(1);
    if(game.reset)game.reset();
    center.style.display='flex';big.textContent=game.cmd;sub.textContent=game.go||'';sub.classList.remove('pulse');
    big.classList.remove('pop');void big.offsetWidth;big.classList.add('pop');
    setTimeout(function(){if(K.state!=='cmd')return;K.state='play';center.style.display='none';if(game.begin)game.begin();},K.MICRO?550:750);
  };
  K.finish=function(win){
    if(K.state!=='play')return;
    K.state='done';
    resT.textContent=win?game.winTitle:game.loseTitle;resN.textContent=win?game.winNote:game.loseNote;
    res.classList.toggle('lose',!win);
    setTimeout(function(){res.classList.add('on');if(!K.MICRO)again.focus({preventScroll:true});},win?(game.winDelay||0):0);
    try{if(window.parent!==window)window.parent.postMessage({source:'tamu-microgame',game:game.id,type:'result',win:win},'*');}catch(e){}
  };
  K.go=function(g){
    game=g;
    if(g.init)g.init();
    if(K.STILL){if(g.still)g.still();return;}
    function loop(ts){
      var dt=Math.min((ts-(last||ts))/1000,0.05);last=ts;
      if(K.state==='play'){timeLeft-=dt;setClock(timeLeft/duration);if(timeLeft<=0){if(g.timeout)g.timeout();K.finish(false);}}
      if(g.frame)g.frame(dt,K.state);
      requestAnimationFrame(loop);
    }
    if(K.AUTO)K.start();
    requestAnimationFrame(loop);
  };
  again.addEventListener('click',function(){K.start();});
  window.addEventListener('keydown',function(e){
    if(e.key==='Escape'){try{if(window.parent!==window)window.parent.postMessage({source:'tamu-microgame',type:'escape'},'*');}catch(x){}return;}
    if(K.state==='attract'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();K.start();}
  });
  window.addEventListener('message',function(e){if(e.data&&e.data.source==='tamu-arcade'&&e.data.type==='start')K.start();});
  return K;
})();
</script>
<script>
(function(){
  var cv=document.getElementById('c'),cx=cv.getContext('2d'),W=0,H=0,DPR=1;
  function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);}
  window.addEventListener('resize',resize);resize();
  var ACC='#2e6fd8',INK='#24262b';
  var t=0,locked=0,prog=0,NEED=K.MICRO?2.4:4.5;
  var ptr={x:-999,y:-999,on:false,touch:false},keys={};
  var tgt={x:0,y:0},seg=null,flash=null,demo={x:0,y:0},trail=[],old=[],stops=[],marks=null,heading=null;
  var meter=document.getElementById('meter');
  function rnd(a,b){return a+Math.random()*(b-a);}
  function pad(){return Math.max(28,Math.min(W,H)*0.14);}
  function randPoint(far){
    var p=pad(),q,tries=0,bottom=H-p-34;
    /* while the title is up, the light stays in the band below it */
    var top=K.state==='attract'?Math.min(Math.max(p+48,H*0.6),bottom-1):p+48;
    do{q={x:rnd(p,W-p),y:rnd(top,bottom)};tries++;}
    while(far&&Math.hypot(q.x-tgt.x,q.y-tgt.y)<Math.min(W,H)*0.38&&tries<30);
    return q;
  }
  var pattern=['pursuit','pursuit','saccade'],pi=0;
  function nextSeg(){
    var kind=pattern[pi%pattern.length];pi++;
    if(kind==='saccade'){
      var q=randPoint(true);flash={x0:tgt.x,y0:tgt.y,x1:q.x,y1:q.y,t:0};
      if(trail.length>1){old.push(trail);if(old.length>2)old.shift();}
      stops.push({x:tgt.x,y:tgt.y},{x:q.x,y:q.y});if(stops.length>4)stops.splice(0,stops.length-4);
      tgt.x=q.x;tgt.y=q.y;trail=[{x:q.x,y:q.y}];heading=null;seg={kind:'fixate',t:0,d:0.5};
    }else{
      /* pick an end point that keeps the line moving forward instead of folding back on itself */
      var e,dx,dy,d,m,diagFirst,best=null,span=Math.min(W,H)*0.3;
      for(var tries=0;tries<24;tries++){
        e=randPoint(false);dx=e.x-tgt.x;dy=e.y-tgt.y;d=Math.min(Math.abs(dx),Math.abs(dy));diagFirst=Math.random()<0.5;
        m=diagFirst?{x:tgt.x+Math.sign(dx)*d,y:tgt.y+Math.sign(dy)*d}:{x:e.x-Math.sign(dx)*d,y:e.y-Math.sign(dy)*d};
        var hx=m.x-tgt.x,hy=m.y-tgt.y;if(Math.hypot(hx,hy)<1){hx=e.x-m.x;hy=e.y-m.y;}
        var fwd=heading?(hx*heading.x+hy*heading.y)/(Math.hypot(hx,hy)||1):1;
        var score=(fwd>-0.05?2:0)+(Math.hypot(dx,dy)>span?1:0);
        if(!best||score>best.score)best={e:e,m:m,score:score};
        if(score===3)break;
      }
      e=best.e;m=best.m;
      heading={x:e.x-m.x,y:e.y-m.y};var hl=Math.hypot(heading.x,heading.y);if(hl<1){heading={x:m.x-tgt.x,y:m.y-tgt.y};hl=Math.hypot(heading.x,heading.y)||1;}
      heading.x/=hl;heading.y/=hl;
      var a=Math.hypot(m.x-tgt.x,m.y-tgt.y),b=Math.hypot(e.x-m.x,e.y-m.y);
      if(!trail.length)trail=[{x:tgt.x,y:tgt.y}];
      seg={kind:'pursuit',t:0,d:rnd(1.3,1.8),p0:{x:tgt.x,y:tgt.y},p1:m,p2:e,a:a,len:(a+b)||1};
    }
  }
  function ease(u){return u<0.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;}
  function stepTarget(dt){
    if(!seg)nextSeg();
    seg.t+=dt;
    if(seg.kind==='pursuit'){
      var dist=ease(Math.min(1,seg.t/seg.d))*seg.len,A=seg.p0,B=seg.p1,C=seg.p2;
      if(dist<=seg.a){var f=seg.a?dist/seg.a:1;tgt.x=A.x+(B.x-A.x)*f;tgt.y=A.y+(B.y-A.y)*f;}
      else{var g=(dist-seg.a)/((seg.len-seg.a)||1);tgt.x=B.x+(C.x-B.x)*g;tgt.y=B.y+(C.y-B.y)*g;}
      trail.push({x:tgt.x,y:tgt.y});if(trail.length>400)trail.shift();
    }
    if(seg.t>=seg.d)nextSeg();
    if(flash){flash.t+=dt;if(flash.t>0.24)flash=null;}
  }
  function radius(){var r=Math.max(26,Math.min(W,H)*0.07);return ptr.touch?r*1.5:r;}
  function draw(){
    cx.clearRect(0,0,W,H);
    cx.lineCap='round';cx.lineJoin='round';
    if(marks){cx.setLineDash([6,9]);cx.strokeStyle='rgba(36,38,43,.45)';cx.lineWidth=3;
      cx.beginPath();cx.moveTo(marks[0].x,marks[0].y);for(var m=1;m<marks.length;m++)cx.lineTo(marks[m].x,marks[m].y);cx.stroke();cx.setLineDash([]);}
    var lw=Math.max(8,Math.min(W,H)*0.026);
    function path(pts,col){if(pts.length<2)return;cx.strokeStyle=col;cx.lineWidth=lw;cx.beginPath();cx.moveTo(pts[0].x,pts[0].y);for(var i=1;i<pts.length;i++)cx.lineTo(pts[i].x,pts[i].y);cx.stroke();}
    old.forEach(function(o){path(o,'rgba(46,111,216,.22)');});
    path(trail,ACC);
    stops.forEach(function(q){cx.fillStyle='#fff';cx.strokeStyle=INK;cx.lineWidth=4;cx.beginPath();cx.arc(q.x,q.y,Math.max(7,Math.min(W,H)*0.02),0,Math.PI*2);cx.fill();cx.stroke();});
    if(flash){cx.setLineDash([6,9]);cx.strokeStyle='rgba(36,38,43,'+(0.5*(1-flash.t/0.24))+')';cx.lineWidth=3;
      cx.beginPath();cx.moveTo(flash.x0,flash.y0);cx.lineTo(flash.x1,flash.y1);cx.stroke();cx.setLineDash([]);}
    if(marks){marks.forEach(function(q){cx.fillStyle='#fff';cx.strokeStyle=INK;cx.lineWidth=3;cx.beginPath();cx.arc(q.x,q.y,Math.max(7,Math.min(W,H)*0.02),0,Math.PI*2);cx.fill();cx.stroke();});}
    var r=Math.max(10,Math.min(W,H)*0.028);
    if(K.state==='play'&&locked){cx.strokeStyle='rgba(46,111,216,.35)';cx.lineWidth=4;
      cx.beginPath();cx.arc(tgt.x,tgt.y,r+11+Math.sin(t*10)*2,0,Math.PI*2);cx.stroke();}
    cx.fillStyle=ACC;cx.beginPath();cx.arc(tgt.x,tgt.y,r,0,Math.PI*2);cx.fill();
    cx.fillStyle='#fff';cx.beginPath();cx.arc(tgt.x,tgt.y,r*0.42,0,Math.PI*2);cx.fill();
    var px=K.state==='attract'?demo.x:ptr.x,py=K.state==='attract'?demo.y:ptr.y;
    if(K.state==='attract'||ptr.on){
      var R=radius()*0.7;cx.strokeStyle=K.state==='attract'?'rgba(36,38,43,.45)':INK;cx.lineWidth=3;
      cx.beginPath();cx.arc(px,py,R,0,Math.PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(px-R-7,py);cx.lineTo(px-R+5,py);cx.moveTo(px+R-5,py);cx.lineTo(px+R+7,py);
      cx.moveTo(px,py-R-7);cx.lineTo(px,py-R+5);cx.moveTo(px,py+R-5);cx.lineTo(px,py+R+7);cx.stroke();
    }
  }
  K.go({
    id:'follow',cmd:'Follow!',go:'Keep on the light',
    duration:function(m){return m?6:12;},
    winTitle:'Session complete',winNote:'Eye Rehab trains saccades and smooth pursuit with eye tracking in VR. Your pointer stood in for your eyes.',
    loseTitle:'Out of time',loseNote:'The light kept moving. Stay on it to fill the meter.',
    init:function(){tgt.x=W*0.5;tgt.y=H*0.76;demo.x=tgt.x;demo.y=tgt.y;},
    reset:function(){prog=0;locked=0;old=[];stops=[];trail=[];meter.style.transform='scaleX(0)';document.body.classList.add('playing');},
    frame:function(dt,s){
      t+=dt;
      if(s==='attract'){if(!K.reduce)stepTarget(dt*0.8);demo.x+=(tgt.x-demo.x)*Math.min(1,dt*3.2);demo.y+=(tgt.y-demo.y)*Math.min(1,dt*3.2);}
      else if(s==='cmd'){stepTarget(dt*0.5);}
      else if(s==='play'){
        stepTarget(dt);
        var sp=360*dt,k=keys;
        if(k.ArrowLeft)ptr.x-=sp;if(k.ArrowRight)ptr.x+=sp;if(k.ArrowUp)ptr.y-=sp;if(k.ArrowDown)ptr.y+=sp;
        if(k.ArrowLeft||k.ArrowRight||k.ArrowUp||k.ArrowDown){ptr.on=true;ptr.x=Math.max(0,Math.min(W,ptr.x));ptr.y=Math.max(0,Math.min(H,ptr.y));}
        locked=(ptr.on&&Math.hypot(ptr.x-tgt.x,ptr.y-tgt.y)<radius())?1:0;
        if(locked)prog+=dt;
        meter.style.transform='scaleX('+Math.min(1,prog/NEED)+')';
        if(prog>=NEED){document.body.classList.remove('playing');K.finish(true);}
      }else if(s==='done'){document.body.classList.remove('playing');}
      draw();
    },
    still:function(){
      /* a saccade jump, then smooth pursuit along a transit line, with the gaze locked on */
      var A={x:W*0.14,y:H*0.24},B={x:W*0.22,y:H*0.66},u=Math.min(W,H)*0.26;
      var C={x:B.x+u,y:B.y-u},D={x:W*0.66,y:C.y},E={x:D.x+H*0.1,y:D.y-H*0.1};
      tgt={x:E.x,y:E.y};marks=[A,B];stops=[];old=[];trail=[B,C,D,E];
      ptr.on=true;ptr.x=tgt.x-W*0.01;ptr.y=tgt.y+H*0.02;K.state='play';locked=1;draw();K.state='attract';
      meter.style.transform='scaleX(.62)';
    }
  });
  function setPtr(e){var r=cv.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;ptr.on=true;ptr.touch=e.pointerType==='touch';}
  cv.addEventListener('pointerdown',function(e){setPtr(e);if(K.state==='attract')K.start();});
  cv.addEventListener('pointermove',function(e){if(K.state!=='attract')setPtr(e);});
  cv.addEventListener('pointerleave',function(e){if(e.pointerType!=='touch')ptr.on=false;});
  cv.addEventListener('pointerup',function(e){if(e.pointerType==='touch')ptr.on=false;});
  window.addEventListener('keydown',function(e){
    if(e.key.indexOf('Arrow')===0){keys[e.key]=true;if(K.state==='play')e.preventDefault();if(ptr.x<0){ptr.x=W/2;ptr.y=H/2;}}
  });
  window.addEventListener('keyup',function(e){keys[e.key]=false;});
  if(K.TEST)window.__G={get tgt(){return tgt;},get state(){return K.state;}};
})();
</script>
</body>
</html>
