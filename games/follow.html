<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Follow! A microgame from Eye Rehab</title>
<style>
@font-face{font-family:"Oswald";src:url("../assets/fonts/oswald.woff2") format("woff2");font-weight:200 700;font-display:swap}
@font-face{font-family:"Open Sans";src:url("../assets/fonts/open-sans.woff2") format("woff2");font-weight:300 800;font-display:swap}
@font-face{font-family:"Silkscreen";src:url("../assets/fonts/silkscreen.woff2") format("woff2");font-display:swap}
:root{
  --screen:#101019;
  --accent:#4DD6FF;
  --paper:#F2F2F5;
  --dim:#A3A3B5;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--screen);color:var(--paper);overflow:hidden;
  font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
#stage{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:pan-y;cursor:crosshair}
body.playing canvas{touch-action:none}
.hud{position:fixed;left:0;right:0;top:0;display:flex;align-items:center;gap:12px;padding:10px 14px;pointer-events:none}
body.embed .hud{padding-right:68px}
.cmd{font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(14px,3.4vw,20px);color:var(--accent);letter-spacing:.02em}
.timer{flex:1;height:8px;background:rgba(242,242,245,.14);border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--paper);transform-origin:left;border-radius:4px}
.meter{position:fixed;left:14px;right:14px;bottom:12px;pointer-events:none}
.meter-track{height:10px;background:rgba(77,214,255,.14);border-radius:5px;overflow:hidden}
.meter-fill{height:100%;width:100%;background:var(--accent);transform:scaleX(0);transform-origin:left;border-radius:5px}
.meter-label{font-family:"Silkscreen";font-size:11px;letter-spacing:.08em;color:var(--dim);margin-top:5px;text-align:center}
.center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;pointer-events:none}
.center.attract{justify-content:flex-start;padding-top:12vh}
.hud{transition:opacity .2s var(--ease-out)}
body.attract .hud{opacity:0}
.title{font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(34px,10vw,72px);line-height:1;color:var(--accent)}
.sub{font-family:"Silkscreen";font-size:clamp(11px,2.6vw,14px);letter-spacing:.06em;margin-top:12px;color:var(--paper)}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.pop{animation:pop .28s var(--ease-out) both}
@keyframes pop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.result{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:24px;background:rgba(16,16,25,.92)}
.result.on{display:flex}
.result h2{font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(24px,6.5vw,44px);margin:0;color:var(--accent);line-height:1.05}
.result p{max-width:34ch;font-size:clamp(14px,3.2vw,16px);line-height:1.5;color:var(--paper);margin:14px 0 0}
.again{margin-top:20px;font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:15px;padding:12px 22px;border:0;border-radius:4px;
  background:var(--accent);color:#06141B;cursor:pointer;transition:transform .12s var(--ease-out)}
.again:active{transform:scale(.97)}
.again:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
body.micro .again{display:none}
@media (prefers-reduced-motion:reduce){.blink,.pop{animation:none}}
</style>
</head>
<body class="attract">
<div id="stage"><canvas id="c" aria-label="Follow the light. Keep your pointer on the moving light to fill the meter. Arrow keys also move the pointer."></canvas></div>
<div class="hud" aria-hidden="true"><span class="cmd">FOLLOW!</span><span class="timer"><i id="timer"></i></span></div>
<div class="meter" aria-hidden="true"><div class="meter-track"><div class="meter-fill" id="meter"></div></div><div class="meter-label">TIME ON TARGET</div></div>
<div class="center attract" id="center"><div class="title" id="bigTitle">FOLLOW!</div><div class="sub blink" id="bigSub">TAP TO PLAY</div></div>
<div class="result" id="result" role="status" aria-live="polite">
  <h2 id="resTitle"></h2>
  <p id="resNote"></p>
  <button class="again" id="again" type="button">Play again</button>
</div>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var MICRO=params.has('micro'), AUTO=params.has('auto')||MICRO;
  var DURATION=MICRO?6:12, NEED=MICRO?2.4:4.5;
  if(MICRO)document.body.classList.add('micro');
  if(params.has('embed'))document.body.classList.add('embed');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var cv=document.getElementById('c'), cx=cv.getContext('2d');
  var W=0,H=0,DPR=1;
  function resize(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;
    cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);cx.setTransform(DPR,0,0,DPR,0,0);}
  window.addEventListener('resize',resize);resize();

  var state='attract', t=0, timeLeft=DURATION, locked=0, last=0;
  var ptr={x:-999,y:-999,on:false,touch:false}, keys={};
  var tgt={x:0,y:0}, seg=null, flash=null, demo={x:0,y:0};

  function rnd(a,b){return a+Math.random()*(b-a);}
  function pad(){return Math.max(28,Math.min(W,H)*0.14);}
  function randPoint(far){
    var p=pad(),q,tries=0,bottom=H-p-26;
    /* while the title is up, the light stays in the band below it */
    var top=state==='attract'?Math.min(Math.max(p+18,H*0.6),bottom-1):p+18;
    do{q={x:rnd(p,W-p),y:rnd(top,bottom)};tries++;}
    while(far&&Math.hypot(q.x-tgt.x,q.y-tgt.y)<Math.min(W,H)*0.38&&tries<30);
    return q;
  }
  var pattern=['pursuit','pursuit','saccade'], pi=0;
  function nextSeg(){
    var kind=pattern[pi%pattern.length]; pi++;
    if(kind==='saccade'){
      var q=randPoint(true); flash={x0:tgt.x,y0:tgt.y,x1:q.x,y1:q.y,t:0};
      tgt.x=q.x;tgt.y=q.y; seg={kind:'fixate',t:0,d:0.5};
    }else{
      var e=randPoint(false), mx=(tgt.x+e.x)/2, my=(tgt.y+e.y)/2;
      var nx=-(e.y-tgt.y), ny=(e.x-tgt.x), L=Math.hypot(nx,ny)||1, bend=rnd(-0.35,0.35)*Math.hypot(e.x-tgt.x,e.y-tgt.y);
      seg={kind:'pursuit',t:0,d:rnd(1.3,1.8),x0:tgt.x,y0:tgt.y,cx:mx+nx/L*bend,cy:my+ny/L*bend,x1:e.x,y1:e.y};
    }
  }
  function ease(u){return u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;}
  function stepTarget(dt){
    if(!seg)nextSeg();
    seg.t+=dt;
    if(seg.kind==='pursuit'){
      var u=ease(Math.min(1,seg.t/seg.d)),a=1-u;
      tgt.x=a*a*seg.x0+2*a*u*seg.cx+u*u*seg.x1; tgt.y=a*a*seg.y0+2*a*u*seg.cy+u*u*seg.y1;
    }
    if(seg.t>=seg.d)nextSeg();
    if(flash){flash.t+=dt;if(flash.t>0.18)flash=null;}
  }

  function radius(){var r=Math.max(26,Math.min(W,H)*0.07);return ptr.touch?r*1.5:r;}

  function draw(){
    cx.clearRect(0,0,W,H);
    cx.fillStyle='rgba(77,214,255,.07)';
    var g=28;for(var x=g/2;x<W;x+=g)for(var y=g/2;y<H;y+=g)cx.fillRect(x,y,1.5,1.5);
    if(flash){cx.strokeStyle='rgba(77,214,255,'+(0.55*(1-flash.t/0.18))+')';cx.lineWidth=3;
      cx.beginPath();cx.moveTo(flash.x0,flash.y0);cx.lineTo(flash.x1,flash.y1);cx.stroke();}
    var isLock=state==='play'&&locked>0;
    var r=Math.max(9,Math.min(W,H)*0.025);
    cx.lineWidth=2;
    for(var k=1;k<=2;k++){
      var rr=r+k*(isLock?11:8)+(isLock?Math.sin(t*12)*2:0);
      cx.strokeStyle='rgba(77,214,255,'+(isLock?0.55/k:0.3/k)+')';
      cx.beginPath();cx.arc(tgt.x,tgt.y,rr,0,Math.PI*2);cx.stroke();
    }
    cx.fillStyle='#4DD6FF';cx.beginPath();cx.arc(tgt.x,tgt.y,r,0,Math.PI*2);cx.fill();
    cx.fillStyle='#E9FBFF';cx.beginPath();cx.arc(tgt.x-r*.3,tgt.y-r*.3,r*.32,0,Math.PI*2);cx.fill();
    var px=state==='attract'?demo.x:ptr.x, py=state==='attract'?demo.y:ptr.y;
    if(state==='attract'||ptr.on){
      cx.strokeStyle=state==='attract'?'rgba(242,242,245,.45)':'rgba(242,242,245,.9)';cx.lineWidth=2;
      var R=radius()*0.7;
      cx.beginPath();cx.arc(px,py,R,0,Math.PI*2);cx.stroke();
      cx.beginPath();cx.moveTo(px-R-6,py);cx.lineTo(px-R+5,py);cx.moveTo(px+R-5,py);cx.lineTo(px+R+6,py);
      cx.moveTo(px,py-R-6);cx.lineTo(px,py-R+5);cx.moveTo(px,py+R-5);cx.lineTo(px,py+R+6);cx.stroke();
    }
  }

  var timerEl=document.getElementById('timer'), meterEl=document.getElementById('meter');
  var center=document.getElementById('center'), bigTitle=document.getElementById('bigTitle'), bigSub=document.getElementById('bigSub');
  var resEl=document.getElementById('result');

  function loop(ts){
    var dt=Math.min((ts-(last||ts))/1000,0.05); last=ts; t+=dt;
    if(state==='attract'){
      if(!reduce)stepTarget(dt*0.8);
      demo.x+=(tgt.x-demo.x)*Math.min(1,dt*3.2); demo.y+=(tgt.y-demo.y)*Math.min(1,dt*3.2);
    }else if(state==='cmd'){
      stepTarget(dt*0.5);
    }else if(state==='play'){
      stepTarget(dt);
      var sp=360*dt;
      if(keys.ArrowLeft)ptr.x-=sp; if(keys.ArrowRight)ptr.x+=sp; if(keys.ArrowUp)ptr.y-=sp; if(keys.ArrowDown)ptr.y+=sp;
      if(keys.ArrowLeft||keys.ArrowRight||keys.ArrowUp||keys.ArrowDown){ptr.on=true;ptr.x=Math.max(0,Math.min(W,ptr.x));ptr.y=Math.max(0,Math.min(H,ptr.y));}
      locked=(ptr.on&&Math.hypot(ptr.x-tgt.x,ptr.y-tgt.y)<radius())?1:0;
      if(locked)prog+=dt;
      timeLeft-=dt;
      timerEl.style.transform='scaleX('+Math.max(0,timeLeft/DURATION)+')';
      meterEl.style.transform='scaleX('+Math.min(1,prog/NEED)+')';
      if(prog>=NEED)finish(true); else if(timeLeft<=0)finish(false);
    }
    draw();
    requestAnimationFrame(loop);
  }
  var prog=0;

  function start(){
    if(state==='play'||state==='cmd')return;
    resEl.classList.remove('on');
    prog=0;timeLeft=DURATION;locked=0;
    timerEl.style.transform='scaleX(1)';meterEl.style.transform='scaleX(0)';
    document.body.classList.add('playing');
    state='cmd';
    center.classList.remove('attract');
    document.body.classList.remove('attract');
    center.style.display='flex';
    bigTitle.textContent='FOLLOW!';bigTitle.classList.remove('pop');void bigTitle.offsetWidth;bigTitle.classList.add('pop');
    bigSub.textContent='KEEP ON THE LIGHT';bigSub.classList.remove('blink');
    setTimeout(function(){state='play';center.style.display='none';},MICRO?550:750);
  }
  function finish(win){
    state='done';document.body.classList.remove('playing');
    document.getElementById('resTitle').textContent=win?'SESSION COMPLETE':'OUT OF TIME';
    document.getElementById('resNote').textContent=win
      ?'Eye Rehab trains saccades and smooth pursuit with eye tracking in VR. Your pointer stood in for your eyes.'
      :'The light kept moving. Stay on it to fill the meter.';
    resEl.classList.add('on');
    if(!MICRO)document.getElementById('again').focus({preventScroll:true});
    try{if(window.parent!==window)window.parent.postMessage({source:'tamu-microgame',game:'follow',type:'result',win:win},'*');}catch(e){}
  }

  function setPtr(e){var r=cv.getBoundingClientRect();ptr.x=e.clientX-r.left;ptr.y=e.clientY-r.top;ptr.on=true;ptr.touch=e.pointerType==='touch';}
  cv.addEventListener('pointerdown',function(e){setPtr(e);if(state==='attract')start();});
  cv.addEventListener('pointermove',function(e){if(state!=='attract')setPtr(e);});
  cv.addEventListener('pointerleave',function(e){if(e.pointerType!=='touch')ptr.on=false;});
  cv.addEventListener('pointerup',function(e){if(e.pointerType==='touch')ptr.on=false;});
  window.addEventListener('keydown',function(e){
    if(e.key.indexOf('Arrow')===0){keys[e.key]=true;if(state==='play')e.preventDefault();if(ptr.x<0){ptr.x=W/2;ptr.y=H/2;}}
    if((e.key==='Enter'||e.key===' ')&&state==='attract'){e.preventDefault();start();}
  });
  window.addEventListener('keyup',function(e){keys[e.key]=false;});
  document.getElementById('again').addEventListener('click',function(){state='attract';start();});
  window.addEventListener('message',function(e){if(e.data&&e.data.source==='tamu-arcade'&&e.data.type==='start')start();});
  window.addEventListener('keydown',function(e){if(e.key==='Escape'){try{if(window.parent!==window)window.parent.postMessage({source:'tamu-microgame',type:'escape'},'*');}catch(x){}}});

  if(params.has('test'))window.__follow={get tgt(){return tgt;},get state(){return state;}};
  tgt.x=W*0.5;tgt.y=H*0.76;demo.x=tgt.x;demo.y=tgt.y;
  if(AUTO){center.style.display='flex';start();}
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
