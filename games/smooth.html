<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Smooth! A microgame from the LOB Game</title>
<style>
@font-face{font-family:"Oswald";src:url("../assets/fonts/oswald.woff2") format("woff2");font-weight:200 700;font-display:swap}
@font-face{font-family:"Open Sans";src:url("../assets/fonts/open-sans.woff2") format("woff2");font-weight:300 800;font-display:swap}
@font-face{font-family:"Silkscreen";src:url("../assets/fonts/silkscreen.woff2") format("woff2");font-display:swap}
:root{--screen:#101019;--accent:#FFB020;--paper:#F2F2F5;--dim:#B3ADA6;--bad:#FF5A4E;--ok:#7FD4A0;
  --ease-out:cubic-bezier(0.23,1,0.32,1)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--screen);color:var(--paper);overflow:hidden;
  font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none}
.hud{position:fixed;left:0;right:0;top:0;height:40px;display:flex;align-items:center;gap:12px;padding:0 14px}
body.embed .hud{padding-right:68px}
.cmd{font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(14px,3.4vw,20px);color:var(--accent)}
.timer{flex:1;height:8px;background:rgba(242,242,245,.14);border-radius:4px;overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:var(--paper);transform-origin:left;border-radius:4px}
#stage{position:fixed;left:0;right:0;top:40px;bottom:52px}
svg{width:100%;height:100%;display:block;touch-action:pan-y}
body.playing svg{touch-action:none}
.tip{position:fixed;left:0;right:0;bottom:0;height:52px;display:flex;align-items:center;justify-content:center;
  padding:0 14px;text-align:center;font-size:clamp(12px,2.8vw,15px);line-height:1.3;color:var(--paper)}
.axis{font-family:"Silkscreen";font-size:12px;fill:var(--dim)}
.lbl{font-family:"Silkscreen";font-size:12px}
.grid{stroke:rgba(242,242,245,.08);stroke-width:1}
.handle{cursor:ew-resize}
.handle circle.hit{fill:transparent}
.handle:focus{outline:none}
.handle:focus-visible circle.ring{stroke:var(--paper);stroke-width:3}
.center{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:24px;pointer-events:none}
.center.dim{background:rgba(16,16,25,.84)}
.title{font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:clamp(34px,10vw,72px);line-height:1;color:var(--accent);}
.sub{font-family:"Silkscreen";font-size:clamp(11px,2.6vw,14px);letter-spacing:.06em;margin-top:12px;background:rgba(16,16,25,.8);padding:4px 8px}
.blink{animation:blink 1.1s steps(2,start) infinite}
@keyframes blink{to{visibility:hidden}}
.pop{animation:pop .28s var(--ease-out) both}
@keyframes pop{from{transform:scale(1.5);opacity:0}to{transform:scale(1);opacity:1}}
.result{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:24px;background:rgba(16,16,25,.92)}
.result.on{display:flex}
.result h2{font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(24px,6.5vw,44px);margin:0;color:var(--accent);line-height:1.05}
.result p{max-width:36ch;font-size:clamp(14px,3.2vw,16px);line-height:1.5;margin:14px 0 0}
.again{margin-top:20px;font-family:"Oswald";font-weight:600;text-transform:uppercase;letter-spacing:.02em;font-size:15px;padding:12px 22px;border:0;border-radius:4px;background:var(--accent);
  color:#1A1004;cursor:pointer;transition:transform .12s var(--ease-out)}
.again:active{transform:scale(.97)}
.again:focus-visible{outline:3px solid var(--paper);outline-offset:3px}
body.micro .again{display:none}
@media (prefers-reduced-motion:reduce){.blink,.pop{animation:none}}
</style>
</head>
<body>
<div class="hud" aria-hidden="true"><span class="cmd">SMOOTH!</span><span class="timer"><i id="timer"></i></span></div>
<div id="stage">
<svg id="svg" viewBox="0 0 640 330" preserveAspectRatio="xMidYMid meet" role="img"
  aria-label="Line of Balance schedule. Three crews: excavation, pipe laying, and backfill. Drag the pipe crew's line so no lines cross.">
  <g id="gridG"></g>
  <g id="linesG"></g>
  <g id="markG"></g>
  <g id="crewG"></g>
  <g id="handlesG"></g>
</svg>
</div>
<div class="tip" id="tip">Crews can’t pass each other. Drag the pipe crew’s line until nothing crosses.</div>
<div class="center dim" id="center"><div class="title" id="bigTitle">SMOOTH!</div><div class="sub blink" id="bigSub">TAP TO PLAY</div></div>
<div class="result" id="result" role="status" aria-live="polite">
  <h2 id="resTitle"></h2><p id="resNote"></p>
  <button class="again" id="again" type="button">Play again</button>
</div>
<script>
(function(){
  var params=new URLSearchParams(location.search);
  var MICRO=params.has('micro'), AUTO=params.has('auto')||MICRO;
  var DURATION=MICRO?8:15, BUF=1, DAYS=20, DEADLINE=18;
  if(MICRO)document.body.classList.add('micro');
  if(params.has('embed'))document.body.classList.add('embed');
  var reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var NS='http://www.w3.org/2000/svg';
  var X0=86,X1=612,YB=286,YT=46;
  function xd(d){return X0+(X1-X0)*d/DAYS;}
  function yu(u){return YB-(YB-YT)*(u-1)/5;}
  function el(tag,attrs,parent){var n=document.createElementNS(NS,tag);for(var k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}

  var crews=[
    {id:'A',name:'EXCAVATION',color:'#C9A27A',s:0,e:10,fixed:true},
    {id:'B',name:'PIPE LAYING',color:'#FFB020',s:2,e:5,fixed:false},
    {id:'C',name:'BACKFILL',color:'#7FD4A0',s:7,e:17,fixed:true}
  ];
  var A=crews[0],B=crews[1],C=crews[2];
  function at(c,u){return c.s+(c.e-c.s)*(u-1)/5;}

  var gridG=document.getElementById('gridG'), linesG=document.getElementById('linesG'),
      markG=document.getElementById('markG'), crewG=document.getElementById('crewG'), handlesG=document.getElementById('handlesG');

  (function grid(){
    for(var u=1;u<=6;u++){el('line',{x1:X0,x2:X1,y1:yu(u),y2:yu(u),'class':'grid'},gridG);
      var t=el('text',{x:X0-12,y:yu(u)+4,'text-anchor':'end','class':'axis'},gridG);t.textContent=u;}
    for(var d=0;d<=DAYS;d+=5){el('line',{x1:xd(d),x2:xd(d),y1:YT-8,y2:YB+6,'class':'grid'},gridG);
      var tx=el('text',{x:xd(d),y:YB+22,'text-anchor':'middle','class':'axis'},gridG);tx.textContent=d;}
    var yl=el('text',{x:X0-12,y:YT-18,'text-anchor':'end','class':'axis'},gridG);yl.textContent='BLOCK';
    var xl=el('text',{x:X1,y:YB+40,'text-anchor':'end','class':'axis'},gridG);xl.textContent='DAY';
    el('line',{x1:xd(DEADLINE),x2:xd(DEADLINE),y1:YT-10,y2:YB+6,stroke:'#FF5A4E','stroke-width':2,'stroke-dasharray':'5 5',opacity:.8},gridG);
    var dl=el('text',{x:xd(DEADLINE)-6,y:YT-16,'text-anchor':'end','class':'lbl',fill:'#FF8A80'},gridG);dl.textContent='DEADLINE';
    var lx=X0+4;
    crews.forEach(function(c){
      var g=el('g',{},gridG);
      el('rect',{x:lx,y:YB+30,width:10,height:10,fill:c.color},g);
      var t=el('text',{x:lx+15,y:YB+39,'class':'lbl',fill:c.color},g);t.textContent=c.name;
      lx+=c.id==='B'?132:122;
    });
  })();

  var lineEls={};
  crews.forEach(function(c){lineEls[c.id]=el('line',{stroke:c.color,'stroke-width':c.fixed?5:7,'stroke-linecap':'round'},linesG);});

  function handle(which){
    var g=el('g',{'class':'handle',tabindex:0,role:'slider','aria-valuemin':0,'aria-valuemax':DAYS,
      'aria-label':which==='s'?'Pipe crew start day':'Pipe crew finish day'},handlesG);
    el('circle',{r:34,'class':'hit'},g);
    el('circle',{r:13,fill:'#101019',stroke:'#FFB020','stroke-width':3,'class':'ring'},g);
    el('path',{d:'M-5 4 L3 -4 L5 -2 L-3 6 Z M-6 6 L-5 4 L-3 6 Z',fill:'#FFB020'},g);
    var tag=el('text',{y:-22,'text-anchor':'middle','class':'lbl',fill:'#F2F2F5'},g);
    if(which==='s')tag.setAttribute('display','none');
    g._tag=tag;g._which=which;return g;
  }
  var hS=handle('s'),hE=handle('e');

  function conflict(P,Q){
    var g1=Q.s-P.s, g6=Q.e-P.e;
    if(g1>=BUF&&g6>=BUF)return null;
    if(g1<BUF&&g6<BUF)return [1,6];
    var us=1+5*(BUF-g1)/(g6-g1);
    return g1<BUF?[1,us]:[us,6];
  }
  function crossing(P,Q){var g1=Q.s-P.s,g6=Q.e-P.e;if((g1>0&&g6>0)||(g1<0&&g6<0)||g1===g6)return null;return 1+5*(0-g1)/(g6-g1);}

  function render(){
    crews.forEach(function(c){var l=lineEls[c.id];l.setAttribute('x1',xd(c.s));l.setAttribute('y1',yu(1));l.setAttribute('x2',xd(c.e));l.setAttribute('y2',yu(6));});
    hS.setAttribute('transform','translate('+xd(B.s)+','+yu(1)+')');hE.setAttribute('transform','translate('+xd(B.e)+','+yu(6)+')');
    hS._tag.textContent='D'+B.s;hE._tag.textContent='D'+B.e;
    hS.setAttribute('aria-valuenow',B.s);hE.setAttribute('aria-valuenow',B.e);
    while(markG.firstChild)markG.removeChild(markG.firstChild);
    var bad=false;
    [[A,B],[B,C]].forEach(function(pq){
      var r=conflict(pq[0],pq[1]);if(!r)return;bad=true;var Q=pq[1];
      el('line',{x1:xd(at(Q,r[0])),y1:yu(r[0]),x2:xd(at(Q,r[1])),y2:yu(r[1]),stroke:'#FF5A4E','stroke-width':11,'stroke-linecap':'round',opacity:.55},markG);
      var cu=crossing(pq[0],Q);
      if(cu!==null&&cu>=1&&cu<=6){var x=xd(at(Q,cu)),y=yu(cu);
        el('path',{d:'M'+(x-8)+' '+(y-8)+'L'+(x+8)+' '+(y+8)+'M'+(x+8)+' '+(y-8)+'L'+(x-8)+' '+(y+8),stroke:'#F2F2F5','stroke-width':3.5,'stroke-linecap':'round'},markG);}
    });
    return !bad;
  }

  var svg=document.getElementById('svg'), drag=null, state='attract', timeLeft=DURATION, last=0, tAttract=0;
  var timerEl=document.getElementById('timer'), center=document.getElementById('center'), bigTitle=document.getElementById('bigTitle'), bigSub=document.getElementById('bigSub');
  var resEl=document.getElementById('result');

  function svgX(evt){var p=svg.createSVGPoint();p.x=evt.clientX;p.y=evt.clientY;return p.matrixTransform(svg.getScreenCTM().inverse()).x;}
  function setDay(which,d){
    d=Math.round(Math.max(0,Math.min(DAYS,d)));
    if(which==='s')B.s=Math.min(d,B.e-2);else B.e=Math.max(d,B.s+2);
    var ok=render();
    if(ok&&state==='play')win();
  }
  [hS,hE].forEach(function(h){
    h.addEventListener('pointerdown',function(e){if(state==='attract'){start();}if(state!=='play'&&state!=='cmd')return;drag=h._which;h.setPointerCapture&&h.setPointerCapture(e.pointerId);e.preventDefault();});
    h.addEventListener('keydown',function(e){
      if(state==='attract'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();start();return;}
      if(state!=='play')return;
      var v=h._which==='s'?B.s:B.e;
      if(e.key==='ArrowRight'||e.key==='ArrowUp'){e.preventDefault();setDay(h._which,v+1);}
      if(e.key==='ArrowLeft'||e.key==='ArrowDown'){e.preventDefault();setDay(h._which,v-1);}
    });
  });
  window.addEventListener('pointermove',function(e){if(!drag||state!=='play')return;setDay(drag,(svgX(e)-X0)/(X1-X0)*DAYS);});
  window.addEventListener('pointerup',function(){drag=null;});
  svg.addEventListener('pointerdown',function(){if(state==='attract')start();});

  function start(){
    if(state==='play'||state==='cmd')return;
    resEl.classList.remove('on');
    B.s=2;B.e=5;render();timeLeft=DURATION;timerEl.style.transform='scaleX(1)';
    while(crewG.firstChild)crewG.removeChild(crewG.firstChild);
    document.body.classList.add('playing');
    state='cmd';center.style.display='flex';center.classList.remove('dim');
    bigTitle.textContent='SMOOTH!';bigTitle.classList.remove('pop');void bigTitle.offsetWidth;bigTitle.classList.add('pop');
    bigSub.textContent='NO CROSSED LINES';bigSub.classList.remove('blink');
    setTimeout(function(){state='play';center.style.display='none';hE.focus({preventScroll:true});},MICRO?550:750);
  }
  function win(){
    state='celebrate';drag=null;document.body.classList.remove('playing');
    crews.forEach(function(c,i){
      var dot=el('circle',{r:7,fill:c.color,stroke:'#101019','stroke-width':2},crewG);
      if(reduce){dot.setAttribute('cx',xd(c.e));dot.setAttribute('cy',yu(6));return;}
      var t0=performance.now()+i*90;
      (function anim(now){var u=Math.max(0,Math.min(1,(now-t0)/900));var uu=1+5*u;
        dot.setAttribute('cx',xd(at(c,uu)));dot.setAttribute('cy',yu(uu));if(u<1)requestAnimationFrame(anim);})(t0);
    });
    setTimeout(function(){finish(true);},MICRO?700:1200);
  }
  function finish(ok){
    state='done';document.body.classList.remove('playing');
    document.getElementById('resTitle').textContent=ok?'BALANCED':'CREWS COLLIDED';
    document.getElementById('resNote').textContent=ok
      ?'In the LOB Game you are the construction manager between the job site and the owner. The play is the schedule itself.'
      :'A crew can’t work a block before the crew ahead of it is done. Slow the pipe crew so its line runs alongside the others.';
    resEl.classList.add('on');
    if(!MICRO)document.getElementById('again').focus({preventScroll:true});
    try{if(window.parent!==window)window.parent.postMessage({source:'tamu-microgame',game:'smooth',type:'result',win:ok},'*');}catch(e){}
  }
  document.getElementById('again').addEventListener('click',function(){state='attract';start();});
  window.addEventListener('message',function(e){if(e.data&&e.data.source==='tamu-arcade'&&e.data.type==='start')start();});
  window.addEventListener('keydown',function(e){if(e.key==='Escape'){try{if(window.parent!==window)window.parent.postMessage({source:'tamu-microgame',type:'escape'},'*');}catch(x){}}});

  function loop(ts){
    var dt=Math.min((ts-(last||ts))/1000,0.05);last=ts;
    if(state==='attract'&&!reduce){tAttract+=dt;var k=(Math.sin(tAttract*1.6)+1)/2;B.e=Math.round(5+k*8);B.s=2;render();}
    if(state==='play'){timeLeft-=dt;timerEl.style.transform='scaleX('+Math.max(0,timeLeft/DURATION)+')';if(timeLeft<=0)finish(false);}
    requestAnimationFrame(loop);
  }
  render();
  if(AUTO){center.style.display='flex';start();}
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
