<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Move! A microgame from DuoRehab</title>
<style>
@font-face{font-family:"Oswald";src:url("../assets/fonts/oswald.woff2") format("woff2");font-weight:200 700;font-display:swap}
@font-face{font-family:"Open Sans";src:url("../assets/fonts/open-sans.woff2") format("woff2");font-weight:300 800;font-display:swap}
:root{
  /* one canvas for every demo, Mini Metro style: a quiet limestone grey under bold transit-line colors */
  --paper:#eeedea;--accent:#2e9e57;
  --ink:#24262b;--ink-2:#5e6370;--card:#ffffff;--line:rgba(36,38,43,.14);
  --red:#e0443a;--orange:#ee8a1f;--yellow:#f2b21c;--green:#2e9e57;--teal:#13998f;--blue:#2e6fd8;--purple:#7d53c8;--brown:#8e5b33;
  --ease-out:cubic-bezier(0.23,1,0.32,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--paper);color:var(--ink);
  font-family:"Open Sans","Helvetica Neue",Arial,sans-serif;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
.hud{position:fixed;left:0;right:0;top:0;z-index:5;height:48px;display:flex;align-items:center;gap:10px;padding:0 16px;pointer-events:none;transition:opacity .2s var(--ease-out)}
body.embed .hud{padding-right:68px}
body.attract .hud{opacity:0}
.cmd{font-family:"Oswald",sans-serif;font-weight:600;font-size:19px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink)}
.clock{width:24px;height:24px;flex:none}
.clock .bg{fill:none;stroke:var(--line);stroke-width:4}
.clock .arc{fill:none;stroke:var(--accent);stroke-width:4;stroke-linecap:round;transform:rotate(-90deg);transform-origin:12px 12px}
.count{margin-left:auto;font-weight:700;font-size:13px;letter-spacing:.06em;color:var(--ink-2)}
.center{position:fixed;inset:0;z-index:6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;pointer-events:none}
.center.attract{justify-content:flex-start;padding-top:13vh}
body.fit #stage{transform-origin:50% 0}
body.fit.attract:not(.still) #stage{transform:translateY(var(--fit-y,45vh)) scale(var(--fit-s,.5))}
body.fit .center.attract{padding-top:6vh}
body.fit .center.attract .title{font-size:clamp(32px,8.5vw,66px)}
.title{font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(40px,11vw,84px);line-height:1;letter-spacing:.01em;text-transform:uppercase;color:var(--ink)}
.title::after{content:"";display:block;width:56%;height:6px;margin:12px auto 0;border-radius:3px;background:var(--accent)}
.sub{margin-top:14px;font-weight:700;font-size:clamp(12px,2.6vw,14px);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-2)}
.pop{animation:pop .3s var(--ease-out) both}
@keyframes pop{from{opacity:0;transform:scale(1.15)}to{opacity:1;transform:none}}
.result{position:fixed;inset:0;z-index:8;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
  background:color-mix(in srgb,var(--paper) 94%,transparent)}
.result.on{display:flex}
.result h2{margin:0;font-family:"Oswald",sans-serif;font-weight:600;font-size:clamp(28px,7vw,48px);line-height:1.05;text-transform:uppercase;color:var(--ink)}
.result h2::after{content:"";display:block;width:48px;height:5px;margin:12px auto 0;border-radius:3px;background:var(--accent)}
.result.lose h2::after{background:var(--ink-2)}
.result p{max-width:38ch;margin:14px 0 0;font-size:clamp(14px,3.1vw,16px);line-height:1.5}
.again{margin-top:20px;min-height:44px;padding:10px 22px;border:0;border-radius:4px;cursor:pointer;background:var(--ink);color:#fff;
  font-family:"Oswald",sans-serif;font-weight:600;font-size:15px;letter-spacing:.06em;text-transform:uppercase;transition:transform .16s var(--ease-out)}
.again:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
/* the play surface takes keyboard focus so Tab always has somewhere to land inside the demo */
.surface:focus{outline:none}
.surface:focus-visible{outline:3px solid var(--ink);outline-offset:-3px}
body.micro .again{display:none}
body.still .hud,body.still .center,body.still .result{display:none!important}
@media (prefers-reduced-motion:reduce){.pop{animation:none}}
@media (prefers-reduced-motion:no-preference){
  .again:active{transform:scale(.97)}
  body.fit #stage{transition:transform .5s var(--ease-out)}
  body.attract .title::after{animation:bar 1.8s ease-in-out infinite}
  @keyframes bar{50%{transform:scaleX(.55)}}
}
#track{position:absolute;left:0;right:0;top:48px;bottom:76px;width:100%;height:calc(100% - 124px);display:block;touch-action:none}
.pct{font-family:"Oswald",sans-serif;font-weight:600;font-size:30px;fill:var(--ink)}
.acc{font-family:"Open Sans",sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;fill:var(--ink-2)}
.rate{font-family:"Open Sans",sans-serif;font-weight:800;font-size:15px;letter-spacing:.1em}
#pop{opacity:0}
.pads{position:fixed;left:0;right:0;bottom:14px;display:flex;justify-content:center;gap:12px}
@media (max-height:340px){.pads{bottom:10px;gap:10px}.pad{width:56px;height:44px}#track{bottom:62px;height:calc(100% - 110px)}}
.pad{width:64px;height:52px;display:grid;place-items:center;padding:0;cursor:pointer;
  border:3px solid var(--ink);border-radius:12px;background:#fff;color:var(--ink);
  transition:background-color .12s ease,color .12s ease,transform .12s var(--ease-out)}
.pad svg{width:24px;height:24px}
.pad:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.pad.on{background:var(--accent);color:#fff}
@media (prefers-reduced-motion:no-preference){.pad:active{transform:scale(.94)}}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
</style>
</head>
<body class="attract">
<div id="stage">
<svg id="track" class="surface" tabindex="0" viewBox="0 0 640 250" preserveAspectRatio="xMidYMid meet" role="group" aria-label="Move cards ride the line toward the ring. When a card reaches the ring, press the matching arrow key or the matching button below."></svg>
<div class="pads">
  <button class="pad" type="button" data-move="left" aria-label="Reach left"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12H5M11 5l-7 7 7 7"/></svg></button>
  <button class="pad" type="button" data-move="up" aria-label="Raise both arms"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20V5M5 11l7-7 7 7"/></svg></button>
  <button class="pad" type="button" data-move="right" aria-label="Reach right"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12h15M13 5l7 7-7 7"/></svg></button>
</div>
<p class="vh" id="said" aria-live="polite"></p>
</div>
<div class="hud" aria-hidden="true">
  <svg class="clock" viewBox="0 0 24 24"><circle class="bg" cx="12" cy="12" r="9"/><circle class="arc" id="clockArc" cx="12" cy="12" r="9"/></svg>
  <span class="cmd">Move!</span><span class="count" id="count"></span>
</div>
<div class="center attract veil" id="center"><div class="title" id="bigTitle">Move!</div><div class="sub pulse" id="bigSub">Tap to play</div></div>
<div class="result" id="result" role="status" aria-live="polite"><h2 id="resTitle"></h2><p id="resNote"></p><button class="again" id="again" type="button">Play again</button></div>
<script>
/* Shared microgame runtime: attract, command flash, timed play, result. */
var K=(function(){
  var q=new URLSearchParams(location.search), b=document.body;
  var K={MICRO:q.has('micro'),STILL:q.has('still'),TEST:q.has('test'),state:'attract'};
  K.AUTO=q.has('auto')||K.MICRO;
  K.reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(q.has('embed'))b.classList.add('embed');
  var FIT=document.getElementById('center').classList.contains('veil');
  if(FIT){b.classList.add('fit');document.getElementById('center').classList.remove('veil');}
  if(K.MICRO)b.classList.add('micro');
  if(K.STILL)b.classList.add('still');
  var center=document.getElementById('center'),big=document.getElementById('bigTitle'),sub=document.getElementById('bigSub'),
      res=document.getElementById('result'),resT=document.getElementById('resTitle'),resN=document.getElementById('resNote'),
      again=document.getElementById('again'),arc=document.getElementById('clockArc'),count=document.getElementById('count');
  var CIRC=2*Math.PI*9;arc.style.strokeDasharray=String(CIRC);
  var game=null,timeLeft=0,duration=1,last=0;
  function setClock(f){arc.style.strokeDashoffset=String(CIRC*(1-Math.max(0,Math.min(1,f))));}
  K.setCount=function(t){count.textContent=t;};
  /* fit: scale the scene into the space under the title block */
  function fit(){
    if(!FIT)return;
    var top=sub.getBoundingClientRect().bottom+16,H=window.innerHeight;
    if(!top||top>H*0.8)return;
    var s=Math.max(0.3,Math.min(0.64,(H-top-10)/H));
    b.style.setProperty('--fit-y',Math.round(top)+'px');b.style.setProperty('--fit-s',s.toFixed(3));
  }
  fit();window.addEventListener('resize',function(){if(K.state==='attract')fit();});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){if(K.state==='attract')fit();});
  if(FIT)document.addEventListener('pointerdown',function(e){if(K.state==='attract'&&!K.STILL&&!(e.target.closest&&e.target.closest('button')))K.start();});
  K.timeFraction=function(){return timeLeft/duration;};
  K.start=function(){
    if(K.state==='play'||K.state==='cmd')return;
    res.classList.remove('on');b.classList.remove('attract');center.classList.remove('attract');center.classList.remove('veil');
    K.state='cmd';duration=game.duration(K.MICRO);timeLeft=duration;setClock(1);
    if(game.reset)game.reset();
    center.style.display='flex';big.textContent=game.cmd;sub.textContent=game.go||'';sub.classList.remove('pulse');
    big.classList.remove('pop');void big.offsetWidth;big.classList.add('pop');
    setTimeout(function(){if(K.state!=='cmd')return;K.state='play';center.style.display='none';if(game.begin)game.begin();},K.MICRO?550:750);
  };
  K.finish=function(win){
    if(K.state!=='play')return;
    K.state='done';
    resT.textContent=win?game.winTitle:game.loseTitle;resN.textContent=win?game.winNote:game.loseNote;
    res.classList.toggle('lose',!win);
    setTimeout(function(){res.classList.add('on');if(!K.MICRO)again.focus({preventScroll:true});},win?(game.winDelay||0):0);
    try{if(window.parent!==window)window.parent.postMessage({source:'tamu-microgame',game:game.id,type:'result',win:win},'*');}catch(e){}
  };
  K.go=function(g){
    game=g;
    if(g.init)g.init();
    if(K.STILL){if(g.still)g.still();return;}
    function loop(ts){
      var dt=Math.min((ts-(last||ts))/1000,0.05);last=ts;
      if(K.state==='play'){timeLeft-=dt;setClock(timeLeft/duration);if(timeLeft<=0){if(g.timeout)g.timeout();K.finish(false);}}
      if(g.frame)g.frame(dt,K.state);
      requestAnimationFrame(loop);
    }
    if(K.AUTO)K.start();
    requestAnimationFrame(loop);
  };
  again.addEventListener('click',function(){K.start();});
  window.addEventListener('keydown',function(e){
    if(e.key==='Escape'){try{if(window.parent!==window)window.parent.postMessage({source:'tamu-microgame',type:'escape'},'*');}catch(x){}return;}
    if(K.state==='attract'&&(e.key==='Enter'||e.key===' ')){e.preventDefault();K.start();}
  });
  window.addEventListener('message',function(e){if(e.data&&e.data.source==='tamu-arcade'&&e.data.type==='start')K.start();});
  return K;
})();
</script>
<script>
(function(){
  var NS='http://www.w3.org/2000/svg';
  function el(tag,attrs,parent){var n=document.createElementNS(NS,tag);for(var k in attrs)n.setAttribute(k,attrs[k]);if(parent)parent.appendChild(n);return n;}
  var svg=document.getElementById('track'),said=document.getElementById('said'),INK='#24262b',ACC='#2e9e57';
  /* the same three grades the DuoRehab app gives, in its colors */
  var GRADE={perfect:{label:'PERFECT',fill:'#23824a',text:'#fff',pts:1},good:{label:'GOOD',fill:'#f2b21c',text:'#24262b',pts:0.6},miss:{label:'MISS',fill:'#c8372d',text:'#fff',pts:0}};
  var HIT=120,LINE_Y=176,START=660,END=28;
  var ARROW={left:'M18 0H-16M-4 -12l-12 12 12 12',up:'M0 18V-16M-12 -4l12-12 12 12',right:'M-18 0H16M4 -12l12 12-12 12'};
  /* line, ring and the accuracy dial */
  el('line',{x1:END,x2:612,y1:LINE_Y,y2:LINE_Y,stroke:ACC,'stroke-width':12,'stroke-linecap':'round'},svg);
  var ring=el('circle',{cx:HIT,cy:LINE_Y,r:42,fill:'#fff',stroke:INK,'stroke-width':6},svg);
  var cueG=el('g',{},svg);
  var pop=el('g',{id:'pop'},svg);
  var popBox=el('rect',{x:HIT-62,y:LINE_Y-118,width:124,height:38,rx:8},pop);
  var popTxt=el('text',{'class':'rate',x:HIT,y:LINE_Y-93,'text-anchor':'middle'},pop);
  var DX=552,DY=72,DR=44,CIRC=2*Math.PI*DR;
  el('circle',{cx:DX,cy:DY,r:DR,fill:'none',stroke:'rgba(36,38,43,.12)','stroke-width':10},svg);
  var dial=el('circle',{cx:DX,cy:DY,r:DR,fill:'none',stroke:ACC,'stroke-width':10,'stroke-linecap':'round','stroke-dasharray':CIRC,'stroke-dashoffset':CIRC,transform:'rotate(-90 '+DX+' '+DY+')'},svg);
  var pct=el('text',{'class':'pct',x:DX,y:DY+11,'text-anchor':'middle'},svg);pct.textContent='0%';
  var acc=el('text',{'class':'acc',x:DX,y:DY+DR+24,'text-anchor':'middle'},svg);acc.textContent='ACCURACY';
  var cues=[],spawned=0,need=6,spawnT=0,gap=0.95,travel=1.7,points=0,graded=0,popAnim=null,ringAnim=null,lastMove='';
  function speed(){return (START-HIT)/travel;}
  function pick(){var o=['left','up','right'].filter(function(m){return m!==lastMove;});lastMove=o[Math.floor(Math.random()*o.length)];return lastMove;}
  function card(move){
    var g=el('g',{},cueG);
    el('rect',{x:-30,y:-30,width:60,height:60,rx:12,fill:'#fff',stroke:INK,'stroke-width':5},g);
    el('path',{d:ARROW[move],fill:'none',stroke:INK,'stroke-width':6,'stroke-linecap':'round','stroke-linejoin':'round'},g);
    return g;
  }
  function spawn(at){var m=pick();var c={move:m,x:at==null?START:at,g:card(m),done:false};cues.push(c);spawned++;place(c);return c;}
  /* cards ride in from the end of the line and fade up as they arrive */
  function place(c){c.g.setAttribute('transform','translate('+c.x+','+LINE_Y+')');if(!c.done)c.g.setAttribute('opacity',String(Math.max(0,Math.min(1,(START-c.x)/90))));}
  function setDial(){
    var f=graded?points/graded:0,p=Math.round(f*100);
    dial.setAttribute('stroke-dashoffset',String(CIRC*(1-f)));
    dial.setAttribute('stroke',p>=70?ACC:p>=40?'#f2b21c':'#c8372d');
    pct.textContent=p+'%';
  }
  function showGrade(k){
    var g=GRADE[k];popBox.setAttribute('fill',g.fill);popTxt.setAttribute('fill',g.text);popTxt.textContent=g.label;
    said.textContent=g.label.charAt(0)+g.label.slice(1).toLowerCase();
    if(popAnim)popAnim.cancel();
    if(K.reduce||!pop.animate){pop.style.opacity=1;clearTimeout(pop._t);pop._t=setTimeout(function(){pop.style.opacity=0;},520);return;}
    popAnim=pop.animate([{opacity:0,transform:'translateY(8px)'},{opacity:1,transform:'none',offset:0.18},{opacity:1,transform:'none',offset:0.75},{opacity:0,transform:'none'}],
      {duration:700,easing:'cubic-bezier(0.23,1,0.32,1)'});
  }
  function flashRing(col){
    ring.setAttribute('fill',col);clearTimeout(ring._t);ring._t=setTimeout(function(){ring.setAttribute('fill','#fff');},160);
  }
  function grade(c,k){
    c.done=true;points+=GRADE[k].pts;graded++;setDial();showGrade(k);K.setCount(graded+'/'+need);
    if(k==='miss'){c.g.setAttribute('opacity','0.35');}
    else{flashRing(GRADE[k].fill);
      if(!K.reduce&&c.g.animate){var a=c.g.animate([{opacity:1},{opacity:0}],{duration:200,easing:'ease-out',fill:'forwards'});a.onfinish=function(){c.g.remove();};}
      else c.g.remove();
      cues.splice(cues.indexOf(c),1);}
    if(graded>=need&&K.state==='play'){var win=points/need>=0.6;setTimeout(function(){K.finish(win);},380);}
  }
  function press(move){
    if(K.state==='attract'){K.start();return;}
    if(K.state!=='play')return;
    var pad=document.querySelector('.pad[data-move="'+move+'"]');
    if(pad){pad.classList.add('on');clearTimeout(pad._t);pad._t=setTimeout(function(){pad.classList.remove('on');},140);}
    var best=null,bd=1e9;
    cues.forEach(function(c){if(c.done)return;var d=Math.abs(c.x-HIT);if(d<bd){bd=d;best=c;}});
    if(!best)return;
    var dt=bd/speed();
    if(dt>0.3)return; /* nothing near the ring yet */
    if(best.move!==move){grade(best,'miss');return;}
    grade(best,dt<=0.11?'perfect':'good');
  }
  document.querySelectorAll('.pad').forEach(function(b){
    b.addEventListener('pointerdown',function(e){e.preventDefault();press(b.dataset.move);});
    b.addEventListener('keydown',function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();press(b.dataset.move);}});
  });
  var KEYS={arrowleft:'left',a:'left',arrowup:'up',w:'up',arrowright:'right',d:'right'};
  window.addEventListener('keydown',function(e){var m=KEYS[(e.key||'').toLowerCase()];if(!m||e.repeat)return;
    if(K.state==='play')e.preventDefault();press(m);});
  svg.addEventListener('pointerdown',function(){if(K.state==='attract')K.start();});
  function step(dt,live){
    if(spawned<(live?need:1e9)){spawnT-=dt;if(spawnT<=0){spawn();spawnT=gap;}}
    var v=speed();
    for(var i=cues.length-1;i>=0;i--){var c=cues[i];c.x-=v*dt;place(c);
      if(!live&&!c.done&&c.x<=HIT){c.done=true;flashRing(GRADE.perfect.fill);c.g.remove();cues.splice(i,1);continue;}
      if(live&&!c.done&&c.x<HIT-0.3*v){grade(c,'miss');}
      if(c.x<END-40){c.g.remove();var j=cues.indexOf(c);if(j>=0)cues.splice(j,1);}
    }
  }
  function reset(){
    cues.forEach(function(c){c.g.remove();});cues=[];spawned=0;spawnT=0.25;points=0;graded=0;lastMove='';
    if(popAnim){popAnim.cancel();popAnim=null;}pop.style.opacity=0;ring.setAttribute('fill','#fff');
    setDial();K.setCount('0/'+need);
  }
  K.go({
    id:'move',cmd:'Move!',go:'Match each move',winDelay:300,
    duration:function(m){need=m?4:6;gap=m?0.85:0.95;return 0.25+(need-1)*gap+travel+1.4;},
    winTitle:'Session complete',winNote:'In DuoRehab you act out each rehab move in front of the camera, like Just Dance, and it scores how closely you match.',
    loseTitle:'Keep practicing',loseNote:'Press the matching arrow as each move card reaches the ring. Most of the session needs to land.',
    init:function(){reset();},
    reset:reset,
    frame:function(dt,s){
      if(s==='play')step(dt,true);
      else if(s==='attract'&&!K.reduce)step(dt,false);
    },
    still:function(){
      reset();
      [[HIT,'up'],[HIT+200,'right'],[HIT+380,'left']].forEach(function(q){lastMove='';var c=spawn(q[0]);c.g.remove();c.move=q[1];c.g=card(q[1]);place(c);});
      cues.forEach(function(c){c.g.setAttribute('opacity','1');});
      graded=5;points=4.2;setDial();
      popBox.setAttribute('fill',GRADE.perfect.fill);popTxt.setAttribute('fill','#fff');popTxt.textContent='PERFECT';pop.style.opacity=1;
      ring.setAttribute('fill','#fff');
    }
  });
  if(K.TEST)window.__G={get state(){return K.state;},
    ready:function(){var v=speed();var c=cues.filter(function(c){return !c.done&&Math.abs(c.x-HIT)/v<0.08;})[0];return c?c.move:null;}};
})();
</script>
</body>
</html>
